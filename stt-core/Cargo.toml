[package]
name = "jarvis-stt"
version = "0.1.0"
edition = "2021"
description = "Jarvis offline speech-to-text core (macOS only, Whisper via whisper.cpp + Metal)"

[lib]
name = "jarvis_stt"
# staticlib ships to SwiftPM; rlib lets examples/tests link the crate.
crate-type = ["staticlib", "rlib"]

[features]
default = ["metal"]
metal = ["whisper-rs/metal"]

[dependencies]
whisper-rs = { version = "0.13", default-features = false }
cpal = "0.15"
arboard = "3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
sha2 = "0.10"
dirs = "5"
swift-bridge = "0.1"
core-graphics = "0.23"
core-foundation = "0.10"

[build-dependencies]
swift-bridge-build = "0.1"

[dev-dependencies]
hound = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2
