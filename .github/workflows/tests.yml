name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Python regression tests
        run: python -B -m unittest discover -s backend/tests -v
      - name: Build native bridges
        run: |
          ./scripts/build_rust_core.sh --release
          ./scripts/build_stt.sh --release
      - name: Native regression tests
        run: |
          cargo test --locked --manifest-path rust-core/Cargo.toml
          zsh scripts/test_stt.zsh
      - name: Swift regression tests
        run: swift test
      - name: PostgreSQL integration tests
        run: |
          brew install postgresql@18
          python scripts/test_postgres.py
